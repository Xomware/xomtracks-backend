name: Deploy Backend

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      lambdas:
        description: Comma-separated lambda folders to deploy. Empty rebuilds the layer and deploys all.
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-lambda-python.yml@v1
    with:
      app: xomtracks
      python-version: '3.12'
      test-command: pip install -q pytest-asyncio && python -m pytest tests -q
      lambdas: ${{ inputs.lambdas }}
      function-names: |
        auth_spotify_callback=xomtracks-auth-spotify_callback
        auth_spotify_login=xomtracks-auth-spotify_login
        me_link_phone=xomtracks-me-link_phone
        shares_match_override=xomtracks-shares-match_override
        album_art_backfill=
        genre_backfill=
        matching_sweep=
        owner_backfill=
